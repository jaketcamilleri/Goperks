crons:
  - name: renewal-reminders
    description: "Emails members whose yearly membership ends within 14 days, with their savings so far"
    cron: "0 9 * * *"
    timezone: "Australia/Melbourne"
    endpoint: "{{BASE_URL}}/api/cron/renewal-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: gift-deliveries
    description: "Emails gift memberships scheduled for today (sent 7am Melbourne)"
    cron: "0 7 * * *"
    timezone: "Australia/Melbourne"
    endpoint: "{{BASE_URL}}/api/cron/gift-deliveries"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: weekly-digest
    description: "Emails the owner a Monday 8am summary of new members, revenue and partners awaiting approval"
    cron: "0 8 * * 1"
    timezone: "Australia/Melbourne"
    endpoint: "{{BASE_URL}}/api/cron/weekly-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: partner-reports
    description: "Runs 9am Melbourne daily; on the 1st emails each partner last month's redemptions and member savings"
    cron: "0 9 * * *"
    timezone: "Australia/Melbourne"
    endpoint: "{{BASE_URL}}/api/cron/partner-reports"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
